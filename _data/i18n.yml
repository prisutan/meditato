# Site chrome strings, per language.
# Every visitor-facing label outside article body text lives here — nothing
# hard-coded in a layout or include. To add a language: add a top-level key
# with the same shape, add `_articles/<code>/`, and a `_config.yml` defaults
# scope setting `language: <code>` for that folder.
#
# Category keys must match the `category:` value in article front matter
# (always English — the label is what gets translated, not the data).


title: Meditato
description: "New research, traditions and techniques from around the world — reviewed and added every week."
url: "https://meditato.rs"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  articles:
    output: true
    permalink: /articles/:path/

defaults:
  - scope:
      path: "_articles"
      type: "articles"
    values:
      layout: "article"
  # Language is derived from the folder, so an article can never end up
  # untagged and leak into the wrong language's listings. Front matter still
  # wins if it sets `language:` explicitly.
  - scope:
      path: "_articles/en"
      type: "articles"
    values:
      language: "en"
  - scope:
      path: "_articles/sr"
      type: "articles"
    values:
      language: "sr"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

categories_nav:
  - Breath
  - Mindfulness
  - Sleep
  - Anxiety
  - Traditions
  - Beginners
  - Techniques

exclude:
  - content
  - design
  - "Meditato Logo files"
  - PROJECT_NOTES.md
  - CONTENT_LOG.md
  - README.md
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-feed
  - jekyll-sitemap
